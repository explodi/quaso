# SPDX-License-Identifier: MIT
# The Cloudflare package (packages/cloudflare), which `npm run check` leaves out: its
# generated types and the workerd fixture are up to date, it type-checks, its tests pass in
# workerd (Vitest with Cloudflare's Workers pool), its dependencies have
# permissive licences, and the Worker bundles as a production deploy would. No Cloudflare
# account is needed, and nothing is deployed.
name: Cloudflare

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare:
    name: Cloudflare package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: worker-configuration.d.ts matches wrangler.jsonc
        working-directory: packages/cloudflare
        run: npx wrangler types --strict-vars false --check
      - name: Type checks
        working-directory: packages/cloudflare
        run: |
          npx tsc --noEmit
          cd ../.. && npm run typecheck
      - name: The workerd fixture matches local storage
        run: npm run cf:fixtures -- --check
      - name: Tests in workerd
        run: npm run cf:test
      - name: Licences, with the Cloudflare package's dependencies installed
        run: node scripts/check_licenses.ts
      - name: Bundle the Worker (wrangler deploy --dry-run)
        run: npm run cf:build
      - name: The bundle's size
        run: ls -l packages/cloudflare/dist/worker.js && gzip -c packages/cloudflare/dist/worker.js | wc -c
