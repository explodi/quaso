# SPDX-License-Identifier: MIT
# The Cloudflare package (packages/cloudflare), which `deno task check` leaves out: its
# generated types and the workerd fixture are up to date, it type-checks, its tests pass in
# workerd (Vitest with Cloudflare's Workers pool, run by Deno), its dependencies have
# permissive licences, and the Worker bundles as a production deploy would. No Cloudflare
# account is needed, and nothing is deployed.
name: Cloudflare

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare:
    name: Cloudflare package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
      - run: deno install --frozen-lockfile
      - name: worker-configuration.d.ts matches wrangler.jsonc
        working-directory: packages/cloudflare
        run: deno run -A npm:wrangler types --strict-vars false --check
      - name: Type checks
        working-directory: packages/cloudflare
        run: |
          deno run -A npm:typescript/tsc --noEmit
          cd ../.. && deno task typecheck
      - name: The workerd fixture matches local storage
        run: deno task cf:fixtures --check
      - name: Tests in workerd
        run: deno task cf:test
      - name: Licences, with the Cloudflare package's dependencies installed
        run: deno run -A scripts/check_licenses.ts
      - name: Bundle the Worker (wrangler deploy --dry-run)
        run: deno task cf:build
      - name: The bundle's size
        run: ls -l packages/cloudflare/dist/worker.js && gzip -c packages/cloudflare/dist/worker.js | wc -c
