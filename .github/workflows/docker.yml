# SPDX-License-Identifier: MIT
# Every push to main: builds the official image (deploy/Dockerfile, the `deno compile`
# binary on distroless), runs the Docker smoke test against the amd64 build, and only then
# pushes it for amd64 and arm64 to Docker Hub as explodi/quaso:latest and :sha-<commit>.
# Pull requests build and test the image without pushing it.
#
# Repository secrets: DOCKERHUB_USERNAME, and DOCKERHUB_TOKEN, a Docker Hub access token
# with Read & Write access to explodi/quaso.
name: Docker image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: explodi/quaso

jobs:
  publish:
    name: Build, test and publish explodi/quaso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
      - run: deno install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - name: Build the amd64 image to test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: quaso:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (acceptance test 1) on the image
        run: deno run -A scripts/docker_smoke.ts --image quaso:candidate
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
