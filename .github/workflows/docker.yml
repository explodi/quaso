# SPDX-License-Identifier: MIT
# Every push to main: builds the official image (deploy/Dockerfile, the server on
# distroless Node), runs the Docker smoke test against the amd64 build, and only then
# pushes it for amd64 and arm64 to Docker Hub as <image>:latest and <image>:sha-<commit>.
# Pull requests build and test the image without pushing it.
#
# <image> is the repository variable DOCKERHUB_IMAGE, or <GitHub owner>/quaso. Publishing
# needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, a Docker Hub access
# token with Read & Write access to <image>; without them (as in a fresh fork) the image is
# only built and tested.
name: Docker image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # npm ci leaves browsers alone; `npm run e2e:browser` installs Chrome where tests need it.
  PUPPETEER_SKIP_DOWNLOAD: "true"
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/quaso', github.repository_owner) }}

jobs:
  publish:
    name: Build, test and publish the image
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the amd64 image to test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: quaso:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (acceptance test 1) on the image
        run: node scripts/docker_smoke.ts --image quaso:candidate
      - id: version
        name: The image reports the version in package.json
        run: |
          version="$(jq -r .version package.json)"
          test "$(docker run --rm quaso:candidate version)" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - if: env.PUBLISH == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
