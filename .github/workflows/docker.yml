# SPDX-License-Identifier: MIT
# Every push to main: builds the official image (deploy/Dockerfile, the `deno compile`
# binary on distroless), runs the Docker smoke test against the amd64 build, and only then
# pushes it for amd64 and arm64 to Docker Hub as <image>:latest and <image>:sha-<commit>.
# Pull requests build and test the image without pushing it.
#
# <image> is the repository variable DOCKERHUB_IMAGE, or <GitHub owner>/quaso. Publishing
# needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, a Docker Hub access
# token with Read & Write access to <image>; without them (as in a fresh fork) the image is
# only built and tested.
name: Docker image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/quaso', github.repository_owner) }}

jobs:
  publish:
    name: Build, test and publish the image
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
      - run: deno install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - name: Build the amd64 image to test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: quaso:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (acceptance test 1) on the image
        run: deno run -A scripts/docker_smoke.ts --image quaso:candidate
      - id: version
        name: The image reports the version in package.json
        run: |
          version="$(jq -r .version package.json)"
          test "$(docker run --rm quaso:candidate version)" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
