# SPDX-License-Identifier: MIT
# Every push and pull request: formatting, lint, types, headers, licences and tests
# (`deno task check`), plus the builds and the optional packages' tests.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: deno task check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
      - run: deno install --frozen-lockfile
      - run: deno task check

  build:
    name: Build the website and the server binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
      - run: deno install --frozen-lockfile
      - run: deno task build
      - run: ./dist/quaso version
      - run: deno task test:binary

  example-game:
    name: Quaso Quest tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/demo-game
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/demo-game/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser tests (Puppeteer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
      - run: deno install --frozen-lockfile
      # Puppeteer installs Chromium before the browser tests.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('deno.lock') }}
      - run: deno task build:web
      - run: deno task e2e:browser
      - run: deno task e2e

  cli:
    # S4.1 and S4.11: the CLI's bundle on every system and runtime it supports, against a
    # development server (Deno runs the server either way).
    name: CLI (${{ matrix.os }}, ${{ matrix.runtime.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime:
          - { name: node 22, command: node, node: "22" }
          - { name: node 24, command: node, node: "24" }
          - { name: deno, command: deno }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
      - run: deno install --frozen-lockfile
      - if: matrix.runtime.command == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.runtime.node }}
      - run: deno task build:cli
      - run: deno run -A scripts/cli_e2e.ts --runtime ${{ matrix.runtime.command }}
