# SPDX-License-Identifier: MIT
# Only synthetic staging data belongs in these instances: the suite writes test files/accounts.
name: Acceptance

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Also used by nightly.yml, so cold-start measurements never overlap staging writes.
concurrency:
  group: quaso-staging-checks
  cancel-in-progress: false

jobs:
  configuration:
    name: Check optional staging configuration
    runs-on: ubuntu-latest
    outputs:
      staging: ${{ steps.config.outputs.staging }}
    steps:
      - id: config
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAGING_URL: ${{ vars.STAGING_URL }}
          INSTANCE_CONFIG: ${{ vars.STAGING_INSTANCE_CONFIG }}
          IMAGE_PUBLISH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        shell: python
        run: |
          import os
          staging = all(os.environ.get(name) for name in (
              "CF_TOKEN", "STAGING_URL", "INSTANCE_CONFIG", "IMAGE_PUBLISH_TOKEN",
              "ADMIN_EMAIL", "ADMIN_PASSWORD"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"staging={str(staging).lower()}\n")
          if not staging:
              print("Cloudflare staging checks skipped: optional staging credentials are not configured.")

  compose:
    name: Production image with local SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: ${{ github.workspace }}/deploy/compose.yaml:${{ github.workspace }}/deploy/compose.acceptance.yaml
      COMPOSE_PROJECT_NAME: quaso-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
      - run: deno install --frozen-lockfile
      - run: deno task e2e:browser
      - run: deno task build:cli
      - run: docker compose build quaso
      - run: docker compose up -d --wait --wait-timeout 120 quaso
      - name: Claim the disposable instance and run acceptance checks
        env:
          QUASO_SETUP_KEY: acceptance-only-setup-key-not-for-deployment
        run: deno task acceptance --url http://127.0.0.1:8000 --compose-dir deploy
      - name: Beta 2 workflow on the production image with Gemini stubbed
        run: deno run -A scripts/docker_workflow.ts quaso:acceptance
      - name: Diagnostic logs (setup links redacted)
        if: failure()
        run: >-
          docker compose logs --no-color quaso |
          sed -E 's#(/setup\?token=)[^"[:space:]]+#\1[redacted]#g'
      - name: Remove this disposable stack and its volume
        if: always()
        run: docker compose down -v --remove-orphans

  cloudflare-staging:
    name: Cloudflare staging
    needs: configuration
    if: needs.configuration.outputs.staging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      QUASO_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
      QUASO_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
      QUASO_SETUP_KEY: ${{ secrets.STAGING_SETUP_KEY }}
      INSTANCE_CONFIG: ${{ vars.STAGING_INSTANCE_CONFIG }}
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/quaso', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
      - run: deno install --frozen-lockfile
      - run: deno task e2e:browser
      - run: deno task build:cli
      - name: Restore staging instance configuration
        shell: python
        run: |
          import os
          from pathlib import Path
          config = Path("quaso.cloudflare.jsonc")
          config.write_text(os.environ["INSTANCE_CONFIG"])
          config.chmod(0o600)
      # Docker publication runs concurrently; never deploy a previous commit's image.
      - name: Wait for the image from this commit
        run: |
          image="$IMAGE:sha-${GITHUB_SHA:0:7}"
          for attempt in {1..60}; do
            if docker manifest inspect "$image" > /dev/null 2>&1; then
              echo "STAGING_IMAGE=$image" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 10
          done
          echo "The image for this commit was not published: $image" >&2
          exit 1
      - run: deno task cf:deploy --env staging --image "$STAGING_IMAGE"
      - name: Wait for the deployed service
        run: curl --fail --retry 12 --retry-all-errors --retry-delay 5 "$STAGING_URL/healthz"
      - name: Run the HTTP, CLI and browser acceptance checks
        run: deno task acceptance --url "$STAGING_URL"
