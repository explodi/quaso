# SPDX-License-Identifier: MIT
name: Nightly performance

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      cold_starts:
        description: Measure three cold starts (waits 11 minutes before each)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quaso-staging-checks
  cancel-in-progress: false

jobs:
  local:
    name: Large local dataset and performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test
        env:
          QUASO_SMOKE: "1"

  cloudflare:
    name: Performance and parity in workerd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Includes the local Durable Object performance case; no cloud account is needed.
      - run: bun run cf:test

  configuration:
    name: Check optional measurement credentials
    runs-on: ubuntu-latest
    outputs:
      staging: ${{ steps.config.outputs.staging }}
    steps:
      - id: config
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          READ_KEY: ${{ secrets.STAGING_READ_API_KEY }}
        shell: python
        run: |
          import os
          enabled = bool(os.environ.get("STAGING_URL") and os.environ.get("READ_KEY"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"staging={str(enabled).lower()}\n")
          if not enabled:
              print("Staging measurements skipped: optional URL/read-key configuration is missing.")

  staging:
    name: Staging request times
    needs: configuration
    if: needs.configuration.outputs.staging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      STAGING_URL: ${{ vars.STAGING_URL }}
      STAGING_READ_API_KEY: ${{ secrets.STAGING_READ_API_KEY }}
      COLD_STARTS: ${{ github.event_name == 'workflow_dispatch' && inputs.cold_starts && '3' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Measure authenticated and anonymous requests
        run: >-
          bun run scripts/measure.ts --url "$STAGING_URL"
          --key "$STAGING_READ_API_KEY" --requests 50 --json
          --cold-starts "$COLD_STARTS" --sleep 660 > measurements.json
      - name: Retain measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-measurements-${{ github.run_id }}
          path: measurements.json
          if-no-files-found: ignore
          retention-days: 30
