# SPDX-License-Identifier: MIT
# Builds the project website (site/, with the Markdown in docs/) and publishes it to GitHub
# Pages. The repository's Pages settings must use "GitHub Actions" as the source.
# Private repositories build it to catch errors; public repositories also deploy it.
name: Website

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "site/**"
      - "docs/**"
      - "packages/design-system/**"
      - "package.json"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # npm ci leaves browsers alone; `npm run e2e:browser` installs Chrome where tests need it.
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # A pushed tag or a manual run from a branch must not publish an unmerged commit.
      - name: The commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: pages
        if: ${{ !github.event.repository.private }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm run site:build
        env:
          # The path the site is served under, such as /quaso, for 404.html.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - if: ${{ !github.event.repository.private }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
