# SPDX-License-Identifier: MIT
# A release (design §5.10, §5.12, S4.1): on a tag such as v1.4.2, publishes the CLI to npm
# and the Docker image to Docker Hub (the repository variable DOCKERHUB_IMAGE, or
# <GitHub owner>/quaso). The tag must match the version in
# packages/cli/package.json and packages/core/package.json.
#
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
      - run: deno install --frozen-lockfile
      - id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in cli core; do
            found="$(jq -r .version "packages/$package/package.json")"
            if [ "$found" != "$version" ]; then
              echo "::error::packages/$package/package.json has version $found, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
          canonical="$(deno eval 'import { VERSION } from "./packages/core/src/version.ts"; console.log(VERSION)')"
          if [ "$canonical" != "$version" ]; then
            echo "::error::The canonical version $canonical does not match $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate the complete application
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
      - run: deno install --frozen-lockfile
      - run: deno task check
      - run: deno task build
      - run: deno task test:binary
      - run: deno task e2e:browser
      - run: deno task e2e
      - run: deno task site:build
      - run: deno task cf:check
      - run: deno task docker:smoke
      - run: deno task docker:workflow

  test:
    # Published npm versions cannot be replaced: test the exact release bundle first.
    name: Build and test the CLI
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
      - run: deno install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Fails when packages/cli/src/version.ts differs from packages/cli/package.json.
      - run: deno task build:cli
      - run: deno run -A scripts/cli_e2e.ts --runtime node
      - run: deno run -A scripts/cli_e2e.ts --runtime deno
      - uses: actions/upload-artifact@v4
        with:
          name: cli-npm
          path: packages/cli/dist
          if-no-files-found: error

  npm:
    name: Publish the CLI to npm
    needs: [check, test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # The package the test job built and tested, byte for byte.
      - uses: actions/download-artifact@v4
        with:
          name: cli-npm
          path: dist
      - name: Publish
        working-directory: dist
        # npm trusts this workflow (npm trust github @quaso/cli --file release.yml): it
        # authenticates with the job's OIDC token and adds provenance by itself.
        # A version such as 1.5.0-rc.1 goes to the "next" tag, not "latest".
        run: >-
          npm publish --access public
          ${{ contains(needs.check.outputs.version, '-') && '--tag next' || '' }}

  docker:
    name: Publish the Docker image
    needs: [check, test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || format('{0}/quaso', github.repository_owner) }}
          # 1.4.2, 1.4 and 1 for v1.4.2; pre-releases only get their own version. `latest`
          # follows main (docker.yml).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notes:
    name: Publish release notes
    needs: [check, npm, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
      - run: deno install --frozen-lockfile
      - name: Write notes and upgrade steps
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: deno run -A scripts/release_notes.ts > release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "v$RELEASE_VERSION" --verify-tag --title "Quaso $RELEASE_VERSION" --notes-file release-notes.md "${args[@]}"
