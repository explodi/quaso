# SPDX-License-Identifier: MIT
# A release (design §5.10, §5.12, S4.1): on a tag such as v1.4.2, publishes the CLI to npm
# and the Docker image to Docker Hub (the repository variable DOCKERHUB_IMAGE, or
# <GitHub owner>/quaso). The tag must match the version in the root package.json, the only
# version: the CLI, the image and the website all report it.
#
# Every push to main also publishes the CLI it builds, as <version>-main.g<commit> (or
# <version>.main.g<commit> when the version is a pre-release) under the npm tag `main`,
# beside the image docker.yml publishes as sha-<commit>: a deployment can pin both to one
# commit. It lives here because npm trusts this workflow file to publish.
#
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]

permissions:
  contents: read

env:
  # npm ci leaves browsers alone; `npm run e2e:browser` installs Chrome where tests need it.
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Every publishing job needs this one: a pushed tag must not publish an unmerged commit.
      - name: The commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: version
        shell: bash
        run: |
          found="$(jq -r .version package.json)"
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            # The `g` keeps the identifier valid semver when the short hash starts with a digit.
            separator="-"
            if [[ "$found" == *-* ]]; then separator="."; fi
            echo "version=${found}${separator}main.g${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          if [ "$found" != "$version" ]; then
            echo "::error::package.json has version $found, but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate the complete application
    # On main, ci.yml has already run these checks for the commit.
    if: github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:server
      - run: npm run e2e:browser
      - run: npm run e2e
      - run: npm run site:build
      - run: npm run cf:check
      - run: npm run docker:smoke
      - run: npm run docker:workflow

  test:
    # Published npm versions cannot be replaced: test the exact release bundle first.
    name: Build and test the CLI
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The oldest Node the npm package supports runs the bundle.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: echo "CLI_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The version to publish (the tag's, or main's per-commit one), so `quaso version` says it.
      - name: Set the version
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: jq --arg version "$VERSION" '.version = $version' package.json > package.json.next && mv package.json.next package.json
      - run: npm run build:cli
      - run: node scripts/cli_e2e.ts --node "$CLI_NODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-npm
          path: packages/cli/dist
          if-no-files-found: error

  npm:
    name: Publish the CLI to npm
    if: github.ref_type == 'tag'
    needs: [check, test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # The package the test job built and tested, byte for byte.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-npm
          path: dist
      - name: The package's version is the tag's (and package.json's)
        run: test "$(jq -r .version dist/package.json)" = "${{ needs.check.outputs.version }}"
      # `latest` is the newest release until a stable version exists. After that, a version
      # such as 1.5.0-rc.1 goes to `next`, so `npm install` never picks a release candidate.
      - id: tag
        name: Choose the npm tag
        working-directory: dist
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          name="$(jq -r .name package.json)"
          versions="$(npm view "$name" versions --json 2>/dev/null || echo '[]')"
          stable="$(echo "$versions" | jq '[if type == "array" then .[] else . end | select(contains("-") | not)] | length')"
          if [[ "$VERSION" == *-* && "$stable" -gt 0 ]]; then tag=next; else tag=latest; fi
          echo "$name@$VERSION goes to $tag ($stable stable versions published)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish
        working-directory: dist
        # npm trusts this workflow (npm trust github <package> --file release.yml): it
        # authenticates with the job's OIDC token and adds provenance by itself.
        run: npm publish --access public --tag "${{ steps.tag.outputs.tag }}"

  npm-main:
    name: Publish main's CLI to npm
    if: github.ref_type == 'branch'
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-npm
          path: dist
      - name: The package's version is main's
        run: test "$(jq -r .version dist/package.json)" = "${{ needs.check.outputs.version }}"
      - name: Publish under the `main` tag
        working-directory: dist
        # Never `latest`: `npm install` keeps picking releases.
        run: npm publish --access public --tag main

  docker:
    name: Publish the Docker image
    if: github.ref_type == 'tag'
    needs: [check, test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || format('{0}/quaso', github.repository_owner) }}
          # 1.4.2, 1.4 and 1 for v1.4.2; pre-releases only get their own version. `latest`
          # follows main (docker.yml).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=false
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notes:
    name: Publish release notes
    if: github.ref_type == 'tag'
    needs: [check, npm, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Write notes and upgrade steps
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: node scripts/release_notes.ts > release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "v$RELEASE_VERSION" --verify-tag --title "Quaso $RELEASE_VERSION" --notes-file release-notes.md "${args[@]}"
