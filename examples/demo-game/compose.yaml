# SPDX-License-Identifier: MIT
# A private, disposable translation playground. Production: ../../deploy/compose.yaml.
name: quaso-quest

services:
  quaso:
    # Keep the playground server on the same ICU-capable revision as the demo CLI.
    image: explodi/quaso:sha-295b2b5
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PUBLIC_URL: http://127.0.0.1:8000
      SETUP_KEY: quaso-quest-local-playground
      TRUST_PROXY: "false"
    volumes:
      - quaso-data:/data
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s

volumes:
  quaso-data:
